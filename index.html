<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="英語學習站">
  <meta name="theme-color" content="#1f3b73">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" type="image/svg+xml" href="icons/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="icons/icon-16.png">
  <title>英語學習站</title>
  <meta name="description" content="英語學習站：統測英文衝刺，A2–C2 閱讀測驗、單字卡、選擇題、翻譯練習與考前倒數">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&family=Patrick+Hand&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="grammar.css">
</head>
<body data-theme="navy" data-font="hand">
  <a class="skip-link" href="#app" data-i18n="skipToMain">跳到主要內容</a>

  <!-- ===== Header ===== -->
  <div class="net-bar" id="netBar" role="status" hidden></div>
  <header class="site-header">
    <div class="brand">
      <p class="brand-title"><span class="bt-long" data-i18n="brandTitle">英語學習站</span><span class="bt-short" data-i18n="brandShort">英語學習站</span></p>
      <time class="brand-now" id="nowClock"></time>
      <p class="brand-sub" data-i18n="brandSub">閱讀測驗 · 單字卡 · 考前倒數 · English for the TVE Joint College Entrance Exam</p>
    </div>
    <div class="header-controls">
      <label class="ctrl ctrl-sel">
        <select id="langSelect" aria-label="Language">
          <option value="zh">中文</option>
          <option value="en">English</option>
        </select>
      </label>
      <label class="ctrl ctrl-sel">
        <select id="fontSelect" aria-label="Font">
          <option value="hand" data-i18n="fontHand">手寫風</option>
          <option value="clean" data-i18n="fontClean">標準字體</option>
        </select>
      </label>
      <label class="ctrl ctrl-sel">
        <select id="themeSelect" aria-label="Theme">
          <option value="navy" data-i18n="themeNavy">深藍</option>
          <option value="forest" data-i18n="themeForest">墨綠</option>
          <option value="plum" data-i18n="themePlum">莓紫</option>
          <option value="sakura" data-i18n="themeSakura">櫻花粉</option>
          <option value="mint" data-i18n="themeMint">薄荷綠</option>
          <option value="sunset" data-i18n="themeSunset">夕陽橘</option>
        </select>
      </label>
      <label class="ctrl lang-mini"><select id="langSelectM" aria-label="語言 Language">
          <option value="zh">中文</option>
          <option value="en">EN</option>
        </select></label>
      <button type="button" class="exam-chip" id="examChip" aria-haspopup="dialog" aria-controls="calPop"><span class="mini-cal" aria-hidden="true"><b id="miniCalMon"></b><i id="miniCalDay"></i></span><span class="exam-chip-date" id="examChipDate"></span><span class="exam-chip-days" id="examChipDays"></span></button>
      <button class="ctrl auth-btn" id="authBtn" type="button"><span class="ab-ico" id="authBtnIco" aria-hidden="true">👤</span><span class="ab-text" id="authBtnText">登入 / 註冊</span></button>
    </div>
  </header>

  <div class="cal-pop hidden" id="calPop" role="dialog" aria-modal="false"></div>

  <!-- ===== Tabs ===== -->
  <nav class="tabs" id="tabs" aria-label="主選單" data-i18n-aria="mainMenu">
    <button class="tab" data-group="home"><span class="tab-icon" aria-hidden="true">🏠</span><span data-i18n="grpHome">首頁</span></button>
    <div class="tab-grp" role="group" aria-labelledby="tabCapLearn"><span class="tab-cap" id="tabCapLearn" data-i18n="grpLearn">學習</span>
      <button class="tab" data-group="read"><span class="tab-icon" aria-hidden="true">📖</span><span data-i18n="grpRead">閱讀</span></button>
      <button class="tab" data-group="words"><span class="tab-icon" aria-hidden="true">🃏</span><span data-i18n="grpWords">單字</span></button>
      <button class="tab" data-group="grammar"><span class="tab-icon" aria-hidden="true">📐</span><span data-i18n="grpGrammar">文法</span></button>
    </div>
    <div class="tab-grp" role="group" aria-labelledby="tabCapPractice"><span class="tab-cap" id="tabCapPractice" data-i18n="grpPractice">練習</span>
      <button class="tab" data-group="mcq"><span class="tab-icon" aria-hidden="true">📝</span><span data-i18n="tabMcq">選擇題</span></button>
      <button class="tab" data-group="cloze"><span class="tab-icon" aria-hidden="true">📄</span><span data-i18n="tabCloze">克漏字</span></button>
      <button class="tab" data-group="translate"><span class="tab-icon" aria-hidden="true">✍️</span><span data-i18n="grpTranslate">翻譯</span></button>
    </div>
    <button class="tab" data-group="record"><span class="tab-icon" aria-hidden="true">📈</span><span data-i18n="grpRecord">紀錄</span></button>
    <button class="tab tab-settings" data-group="settings"><span class="tab-icon" aria-hidden="true">⚙️</span><span data-i18n="tabSettings">設定</span></button>
  </nav>

  <button type="button" id="lvHandle" class="lv-handle" aria-haspopup="dialog" aria-controls="lvDrawer" aria-expanded="false"></button>
  <main id="app" class="page-wrap" tabindex="-1"></main>

  <!-- ===== Phone bottom bar (≤760px) ===== -->
  <nav class="bnav" id="bnav" aria-label="主選單" data-i18n-aria="mainMenu">
    <button class="bnav-btn" data-group="home"><span class="bnav-ico" aria-hidden="true">🏠</span><span data-i18n="grpHome">首頁</span></button>
    <button class="bnav-btn" data-group="learn"><span class="bnav-ico" aria-hidden="true">📚</span><span data-i18n="grpLearn">學習</span><b class="bnav-badge" id="bnavBadge" hidden></b></button>
    <button class="bnav-btn" data-group="practice"><span class="bnav-ico" aria-hidden="true">📝</span><span data-i18n="grpPractice">練習</span></button>
    <button class="bnav-btn" data-group="record"><span class="bnav-ico" aria-hidden="true">📈</span><span data-i18n="grpRecord">紀錄</span></button>
    <button class="bnav-btn" data-group="more" aria-haspopup="dialog" aria-controls="moreSheet"><span class="bnav-ico" aria-hidden="true">☰</span><span data-i18n="grpMore">更多</span></button>
  </nav>
  <button type="button" class="tts-stop" id="ttsStop" hidden><span aria-hidden="true">■</span> <span data-i18n="ttsStop">停止朗讀</span></button>
  <button type="button" class="to-top" id="toTop" aria-label="回到頂端" data-i18n-aria="toTop" hidden>↑</button>

  <footer class="site-footer">
    <span data-i18n="footer">加油！每天進步一點點，考場上就多一分把握。</span>
  </footer>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <!-- ===== 更多 sheet (phone) ===== -->
  <div id="moreSheet" class="modal sheet hidden" role="dialog" aria-modal="true" aria-labelledby="moreTitle"><div class="modal-card"></div></div>

  <!-- ===== 我的程度: the drawer pulled out by the 🎯 tab (the tab sits before the page content, first in the Tab order) ===== -->
  <div id="lvDrawer" class="modal drawer hidden" role="dialog" aria-modal="true" aria-labelledby="lvDrawerTitle"><div class="modal-card"></div></div>

  <!-- ===== First-visit tour (a spotlight per step and a card) ===== -->
  <div id="tour" class="tour hidden" role="dialog" aria-modal="true" aria-labelledby="tourTitle" aria-describedby="tourText"><div class="tour-spot"></div><div class="tour-card"></div><p id="tourLive" class="sr-only" aria-live="polite"></p></div>
  <div id="tourInvite" class="tour-inv hidden" role="dialog" aria-modal="true" aria-labelledby="tourInviteH" aria-describedby="tourInviteB"><div class="ti-card"></div></div>

  <!-- ===== Confirm (askConfirm) ===== -->
  <div id="askModal" class="modal ask hidden" role="alertdialog" aria-modal="true" aria-labelledby="askTitle" aria-describedby="askBody">
    <div class="modal-card">
      <h3 id="askTitle"></h3>
      <p id="askBody"></p>
      <div class="ask-row"><button type="button" class="btn ghost" id="askNo"></button><button type="button" class="btn accent" id="askYes"></button></div>
    </div>
  </div>

  <!-- ===== Login / Register modal ===== -->
  <div id="cityModal" class="modal city-modal hidden" role="dialog" aria-modal="true" aria-labelledby="cityTitle"><div class="city-sheet" id="citySheet" tabindex="-1"></div></div>
  <div id="guideModal" class="modal city-modal guide-modal hidden" role="dialog" aria-modal="true" aria-labelledby="guideTitle"><div class="city-sheet guide-sheet" id="guideSheet" tabindex="-1"></div></div>
  <div id="authModal" class="modal auth-modal hidden" role="dialog" aria-modal="true" aria-labelledby="authTitle">
    <div class="modal-card">
      <h2 id="authTitle" class="sr-only" data-i18n="account">帳號</h2>
      <button class="modal-close" id="authClose" type="button" aria-label="關閉" data-i18n-aria="close">✕</button>
      <div class="auth-tabs">
        <button type="button" class="auth-tab active" data-auth="login" data-i18n="login">登入</button>
        <button type="button" class="auth-tab" data-auth="register" data-i18n="register">註冊</button>
      </div>
      <form id="authForm" autocomplete="on">
        <div class="field"><label for="auEmail" data-i18n="email">Email / 帳號</label><input type="text" id="auEmail" autocomplete="username" inputmode="email" autocapitalize="none" autocorrect="off" spellcheck="false" required></div>
        <div class="field"><label for="auPass" data-i18n="password">密碼</label><input type="password" id="auPass" autocomplete="current-password" required minlength="4"></div>
        <div class="register-only">
          <div class="field"><label for="auName" data-i18n="displayName">姓名 / 暱稱</label><input type="text" id="auName" autocomplete="nickname"></div>
          <div class="field"><label for="auRole" data-i18n="role">身分</label>
            <select class="input" id="auRole"><option value="student" data-i18n="roleStudent">學生</option><option value="teacher" data-i18n="roleTeacher">老師</option></select></div>
          <div class="field teacher-code-field hidden"><label for="auCode" data-i18n="inviteCode">老師邀請碼</label><input type="text" id="auCode" autocomplete="off"></div>
        </div>
        <p class="small muted" id="authMode"></p>
        <p id="authErr" class="form-err" role="alert" hidden></p>
        <button class="btn accent block-cta" type="submit" id="authSubmit"></button>
      </form>
    </div>
  </div>

  <script src="supabase-config.js"></script>
  <script src="data.js"></script>
  <script src="library.js"></script>
  <script src="highfreq.js"></script>
  <script src="worldmap.js"></script>
  <script src="daily.js"></script>
  <script src="reading-zh.js"></script>
  <script src="reading-library.js"></script>
  <script src="translate.js"></script>
  <script src="mcq.js"></script>
  <script src="cloze.js"></script>
  <script src="practice-notes.js"></script>
  <script src="cities.js"></script>
  <script src="grammar-data.js"></script>
  <script src="i18n.js"></script>
  <script src="speech.js"></script>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator && location.protocol !== 'file:') {
      // a new version taking over a page that was already running: say so (app.js shows 重新整理), so the open page never
      // goes on with old code next to new files. The cache update only touches Cache Storage, never the saved practice.
      var hadSW = !!navigator.serviceWorker.controller;
      navigator.serviceWorker.addEventListener('controllerchange', function () { if (hadSW) { window.__swUpdated = true; window.dispatchEvent(new Event('sw-updated')); } hadSW = true; });
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').then(r => { r.update && setInterval(() => r.update().catch(() => {}), 30 * 60 * 1000); }).catch(() => {}));
    }
  </script>
</body>
</html>
