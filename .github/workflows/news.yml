name: Daily English news

on:
  schedule:
    - cron: "41 21 * * *"   # every day at 05:41 Taiwan time (21:41 UTC)
  workflow_dispatch:
  push:
    paths:
      - "scripts/fetch_news.py"
      - "scripts/make_lessons.py"
      - "scripts/article_text.py"
      - ".github/workflows/news.yml"

permissions:
  contents: write

concurrency:
  group: daily-news-${{ github.ref }}
  cancel-in-progress: false   # let a long article run finish; the next run waits

jobs:
  update:
    # only the site's branch: pushes to other branches must not commit news or spend API credit
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch headlines
        run: python3 scripts/fetch_news.py news.json
      - name: Write full study articles with Chinese translations
        continue-on-error: true   # a problem here must not stop today's headlines from being saved
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}           # free: Google Gemini free tier
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}     # optional, paid: Claude is used if this is set
          LESSON_MODEL: ${{ vars.LESSON_MODEL }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          LESSONS_MAX: ${{ vars.LESSONS_MAX }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then pip install --quiet "anthropic>=1.14,<2"; fi
          python3 scripts/make_lessons.py news.json
      - name: Commit news.json if it changed
        run: |
          if git diff --quiet -- news.json; then echo "No changes"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json
          git commit -m "Update daily English news"
          for i in 1 2 3; do git pull --rebase --quiet origin "${{ github.ref_name }}" && git push && exit 0; sleep 5; done
          exit 1
