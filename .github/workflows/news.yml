name: Daily English news

on:
  schedule:
    - cron: "41 21 * * *"   # every day at 05:41 Taiwan time (21:41 UTC)
  workflow_dispatch:
  push:
    paths:
      - "scripts/fetch_news.py"
      - ".github/workflows/news.yml"

permissions:
  contents: write

concurrency:
  group: daily-news
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch headlines
        run: python3 scripts/fetch_news.py news.json
      - name: Commit news.json if it changed
        run: |
          if git diff --quiet -- news.json; then echo "No changes"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json
          git commit -m "Update daily English news"
          git push
