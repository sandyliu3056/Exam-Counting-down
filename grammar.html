<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文法｜英語學習站</title>
  <!-- 文法 is now a tab of the main site (#/grammar): old links (grammar.html, #ch/g-passive, #quiz) go there -->
  <script>
    (function () {
      var h = location.hash, m = /^#ch\/([a-z-]+)$/.exec(h);
      location.replace('./#/grammar' + (m ? '/' + m[1] : h === '#quiz' ? '/quiz' : ''));
    })();
  </script>
  <meta http-equiv="refresh" content="0; url=./#/grammar">
</head>
<body>
  <p><a href="./#/grammar">文法已經搬到網站的「📐 文法」分頁，請點這裡。</a></p>
</body>
</html>
