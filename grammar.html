<body class="grammar-page" data-theme="navy" data-font="hand">
  <a class="skip-link" href="#app">跳到主要內容</a>

  <!-- ===== Header: the same as the main site's ===== -->
  <header class="site-header">
    <div class="brand">
      <p class="brand-title"><a class="gr-brand" href="./">英語學習站</a></p>
    </div>
    <div class="header-controls">
      <label class="ctrl ctrl-sel">
        <select id="fontSelect" aria-label="字體">
          <option value="hand">手寫風</option>
          <option value="clean">標準字體</option>
        </select>
      </label>
      <label class="ctrl ctrl-sel">
        <select id="themeSelect" aria-label="主題顏色">
          <option value="navy">深藍</option>
          <option value="forest">墨綠</option>
          <option value="plum">莓紫</option>
          <option value="sakura">櫻花粉</option>
          <option value="mint">薄荷綠</option>
          <option value="sunset">夕陽橘</option>
        </select>
      </label>
      <a class="btn accent gr-home" href="./" aria-label="回英語學習站"><span aria-hidden="true">🏠</span><span class="gr-home-txt"> 回英語學習站</span></a>
    </div>
  </header>

  <main id="app" class="page-wrap" tabindex="-1">
    <noscript><div class="card">這個頁面需要開啟 JavaScript。</div></noscript>
  </main>

  </footer>

  <button type="button" class="to-top" id="toTop" aria-label="回到頂端" hidden>↑</button>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="grammar-data.js"></script>
  <script src="speech.js"></script>
  <script src="grammar.js"></script>
  <script>
    // the same offline cache as the main site (a first visit may start here, or a home-screen icon made from this page)
    if ('serviceWorker' in navigator && location.protocol !== 'file:') {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
    }
  </script>

</html>
