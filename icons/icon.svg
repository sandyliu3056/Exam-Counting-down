<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse"><circle cx="20" cy="20" r="4" fill="#ffffff" opacity=".12"/></pattern>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2a4d8f"/><stop offset="1" stop-color="#1b335f"/></linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#dots)"/>
  <!-- bookmark ribbon -->
  <path d="M392 0h72v150l-36-28-36 28z" fill="#f6c445"/>
  <!-- chick body -->
  <ellipse cx="256" cy="392" rx="118" ry="28" fill="#000" opacity=".18"/>
  <circle cx="256" cy="282" r="150" fill="#ffd54a"/>
  <circle cx="256" cy="282" r="150" fill="none" stroke="#e0a800" stroke-width="10"/>
  <!-- wings -->
  <ellipse cx="124" cy="300" rx="40" ry="58" fill="#ffc21c" transform="rotate(20 124 300)"/>
  <ellipse cx="388" cy="300" rx="40" ry="58" fill="#ffc21c" transform="rotate(-20 388 300)"/>
  <!-- feet -->
  <path d="M212 418l-22 34M212 418l0 38M212 418l22 34M300 418l-22 34M300 418l0 38M300 418l22 34" stroke="#f08a24" stroke-width="12" stroke-linecap="round"/>
  <!-- cheeks -->
  <circle cx="178" cy="316" r="24" fill="#ff8fab" opacity=".75"/>
  <circle cx="334" cy="316" r="24" fill="#ff8fab" opacity=".75"/>
  <!-- eyes -->
  <circle cx="206" cy="276" r="16" fill="#2b2b2b"/>
  <circle cx="306" cy="276" r="16" fill="#2b2b2b"/>
  <circle cx="212" cy="270" r="5" fill="#fff"/>
  <circle cx="312" cy="270" r="5" fill="#fff"/>
  <!-- beak -->
  <path d="M232 306q24 14 48 0l-24 30z" fill="#f08a24"/>
  <!-- graduation cap -->
  <path d="M256 92l140 52-140 52-140-52z" fill="#1f3b73" stroke="#0f1e3d" stroke-width="8" stroke-linejoin="round"/>
  <path d="M190 164v40q66 40 132 0v-40" fill="#1f3b73" stroke="#0f1e3d" stroke-width="8" stroke-linejoin="round"/>
  <path d="M396 144v62" stroke="#f6c445" stroke-width="8" stroke-linecap="round"/>
  <circle cx="396" cy="212" r="12" fill="#f6c445"/>
  <!-- pencil -->
  <g transform="rotate(-35 420 390)">
    <rect x="380" y="372" width="120" height="30" rx="6" fill="#ff9eb5" stroke="#c2566e" stroke-width="6"/>
    <rect x="380" y="372" width="26" height="30" rx="6" fill="#ffd0dc" stroke="#c2566e" stroke-width="6"/>
    <path d="M500 372l34 15-34 15z" fill="#f3c7a0" stroke="#c2566e" stroke-width="6" stroke-linejoin="round"/>
    <path d="M522 382l12 5-12 5z" fill="#2b2b2b"/>
  </g>
</svg>
